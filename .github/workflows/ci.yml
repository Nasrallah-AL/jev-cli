name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Smoke test the built binary
        run: |
          node dist/cli.js --version
          node dist/cli.js screen "hello" --dry-run > /dev/null
      - name: Live end-to-end (only when a key is configured)
        if: matrix.node == 22 && env.TYPESAFE_API_KEY != ''
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: npm run test:e2e
